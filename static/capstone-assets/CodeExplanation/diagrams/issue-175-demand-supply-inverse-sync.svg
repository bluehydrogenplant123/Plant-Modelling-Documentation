<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <rect width="1800" height="1100" fill="#f7fafc"/><text x="60" y="70" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#17324d">Issue #175 | Demand/Supply delete-save inverse synchronization</text><text x="60" y="106" font-family="Verdana,sans-serif" font-size="18" fill="#526777">Canonical snapshot restoration + atomic Mongo persistence | no schema bump</text>
  <g font-family="Verdana,sans-serif" text-anchor="middle"><rect x="70" y="180" width="270" height="150" rx="18" fill="#eaf4f4" stroke="#2a6f6b" stroke-width="3"/><text x="205" y="225" font-size="20" font-weight="700" fill="#17324d">1. Editor</text><text x="205" y="265" font-size="17" fill="#17324d">Delete entity or mapping</text><text x="205" y="295" font-size="17" fill="#17324d">Save arrays</text>
  <rect x="410" y="180" width="280" height="150" rx="18" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="550" y="225" font-size="20" font-weight="700" fill="#17324d">2. PUT /costs</text><text x="550" y="265" font-size="17" fill="#17324d">Sanitize current + prior</text><text x="550" y="295" font-size="17" fill="#17324d">Merge requested scope</text>
  <rect x="760" y="180" width="280" height="150" rx="18" fill="#e9eef8" stroke="#3e5c8a" stroke-width="3"/><text x="900" y="225" font-size="20" font-weight="700" fill="#17324d">3. Binding diff</text><text x="900" y="265" font-size="17" fill="#17324d">removed = prior - current</text>
  <ellipse cx="1250" cy="200" rx="130" ry="35" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><rect x="1120" y="200" width="260" height="115" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><ellipse cx="1250" cy="315" rx="130" ry="35" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="1250" y="235" font-size="19" font-weight="700" fill="#17324d">DomainSnapshot</text><text x="1250" y="270" font-size="16" fill="#17324d">canonical unfixed state</text>
  <rect x="250" y="430" width="1230" height="390" rx="20" fill="#ffffff" stroke="#17324d" stroke-width="4"/><text x="865" y="475" font-size="24" font-weight="700" fill="#17324d">Mongo interactive transaction</text>
  <rect x="305" y="515" width="260" height="165" rx="15" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="435" y="555" font-size="18" font-weight="700" fill="#17324d">Restore removed targets</text><text x="435" y="595" font-size="15" fill="#17324d">full model_var_object</text><text x="435" y="625" font-size="15" fill="#17324d">no stale F/value</text>
  <rect x="605" y="515" width="260" height="165" rx="15" fill="#fdecec" stroke="#b33a3a" stroke-width="3"/><text x="735" y="555" font-size="18" font-weight="700" fill="#17324d">Clear sparse overrides</text><text x="735" y="595" font-size="15" fill="#17324d">Base patches</text><text x="735" y="625" font-size="15" fill="#17324d">MTP Economic only</text>
  <rect x="905" y="515" width="260" height="165" rx="15" fill="#e9eef8" stroke="#3e5c8a" stroke-width="3"/><text x="1035" y="555" font-size="18" font-weight="700" fill="#17324d">Reapply current</text><text x="1035" y="595" font-size="15" fill="#17324d">preserve remaining targets</text>
  <rect x="1205" y="515" width="220" height="165" rx="15" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="1315" y="555" font-size="18" font-weight="700" fill="#17324d">Persist arrays</text><text x="1315" y="595" font-size="15" fill="#17324d">including []</text>
  <rect x="380" y="900" width="300" height="80" rx="16" fill="#ddf3e4" stroke="#26734d" stroke-width="3"/><text x="530" y="950" font-size="20" font-weight="700" fill="#17324d">All succeed: commit</text><rect x="900" y="890" width="360" height="100" rx="16" fill="#fdecec" stroke="#b33a3a" stroke-width="3"/><text x="1080" y="935" font-size="20" font-weight="700" fill="#17324d">Any failure: rollback all</text><text x="1080" y="965" font-size="15" fill="#17324d">No partial Node/spec/array state</text></g>
  <g fill="none" stroke="#526777" stroke-width="4" marker-end="url(#a)"><path d="M340 255H410"/><path d="M690 255H760"/><path d="M565 598H605"/><path d="M865 598H905"/><path d="M1165 598H1205"/></g><path d="M1120 280H1080V515H565" fill="none" stroke="#2e7d32" stroke-width="4" marker-end="url(#a)"/><path d="M560 820V900" fill="none" stroke="#26734d" stroke-width="4" marker-end="url(#a)"/><path d="M1080 820V890" fill="none" stroke="#b33a3a" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
