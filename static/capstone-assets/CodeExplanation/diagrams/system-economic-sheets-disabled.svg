<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Issue 166 system economic sheets excluded before parsing</title>
  <desc id="desc">Before the fix, economic sheets were parsed, exported, and loaded into CostEntitiesConfig, which could gate later import phases. After the fix, a sheet-name filter skips economic sheets before parsing while non-economic import continues through process_streams and CostEntitiesConfig remains unchanged.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/></marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#1f2937}.subtitle{font:14px Arial,sans-serif;fill:#4b5563}.lane-title{font:700 18px Arial,sans-serif}.node-title{font:700 13px Arial,sans-serif}.copy{font:13px Arial,sans-serif}.edge{fill:none;stroke:#4b5563;stroke-width:2;marker-end:url(#arrow)}.edge-green{fill:none;stroke:#548d5a;stroke-width:2;marker-end:url(#arrow)}.edge-red{fill:none;stroke:#b85450;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="title">Issue #166: System workbook economics are excluded before parsing</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">Price, demand, supply, templates, and legacy cost sheets cannot gate the non-economic import</text>
  <rect x="40" y="110" width="520" height="480" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <path d="M40 150 H560" stroke="#d6b656" stroke-width="2"/>
  <text x="300" y="137" text-anchor="middle" class="lane-title" fill="#7c4a03">BEFORE</text>
  <rect x="640" y="110" width="520" height="480" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <path d="M640 150 H1160" stroke="#82b366" stroke-width="2"/>
  <text x="900" y="137" text-anchor="middle" class="lane-title" fill="#1e5b2a">AFTER ISSUE #166</text>
  <polygon points="80,180 250,180 270,280 100,280" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="175" y="202" text-anchor="middle" class="node-title" fill="#7c4a03">System workbook</text><text x="175" y="223" text-anchor="middle" class="copy" fill="#7c4a03">Price_Demand mapping</text><text x="175" y="243" text-anchor="middle" class="copy" fill="#7c4a03">Prices / Demand_Supply</text><text x="175" y="263" text-anchor="middle" class="copy" fill="#7c4a03">U templates / Entity Specs</text>
  <rect x="330" y="180" width="190" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="425" y="207" text-anchor="middle" class="node-title" fill="#1f4e79">Resolve mapping</text><text x="425" y="229" text-anchor="middle" class="copy" fill="#1f4e79">parse and validate every</text><text x="425" y="247" text-anchor="middle" class="copy" fill="#1f4e79">economic sheet</text>
  <rect x="330" y="300" width="190" height="90" rx="10" fill="#f5f5f5" stroke="#666" stroke-width="2"/><text x="425" y="323" text-anchor="middle" class="node-title" fill="#333">Economic CSVs</text><text x="425" y="344" text-anchor="middle" class="copy" fill="#333">Prices.csv</text><text x="425" y="363" text-anchor="middle" class="copy" fill="#333">Demand_Supply.csv</text><text x="425" y="382" text-anchor="middle" class="copy" fill="#333">SYS Costs.csv fallback</text>
  <rect x="330" y="470" width="190" height="70" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="425" y="498" text-anchor="middle" class="node-title" fill="#7f1d1d">process_costs(conn)</text><text x="425" y="521" text-anchor="middle" class="copy" fill="#7f1d1d">validate + upsert defaults</text>
  <rect x="80" y="470" width="190" height="80" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="175" y="498" text-anchor="middle" class="node-title" fill="#7f1d1d">Import gate</text><text x="175" y="520" text-anchor="middle" class="copy" fill="#7f1d1d">malformed contract can stop</text><text x="175" y="539" text-anchor="middle" class="copy" fill="#7f1d1d">later phases</text>
  <path d="M80 315 C80 300,270 300,270 315 V375 C270 390,80 390,80 375 Z" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><ellipse cx="175" cy="315" rx="95" ry="15" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="175" y="345" text-anchor="middle" class="node-title" fill="#7f1d1d">CostEntitiesConfig</text><text x="175" y="367" text-anchor="middle" class="copy" fill="#7f1d1d">mutated by workbook</text>
  <path d="M270 220 H330" class="edge"/><path d="M425 260 V300" class="edge"/><path d="M425 390 V470" class="edge"/><path d="M330 505 H285 V355 H270" class="edge"/><path d="M330 520 H270" class="edge-red"/>
  <polygon points="680,180 850,180 870,270 700,270" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="775" y="205" text-anchor="middle" class="node-title" fill="#7c4a03">System workbook</text><text x="775" y="228" text-anchor="middle" class="copy" fill="#7c4a03">same economic sheets</text><text x="775" y="250" text-anchor="middle" class="copy" fill="#7c4a03">plus normal catalog sheets</text>
  <rect x="930" y="180" width="190" height="70" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1025" y="207" text-anchor="middle" class="node-title" fill="#1f4e79">Sheet-name filter</text><text x="1025" y="230" text-anchor="middle" class="copy" fill="#1f4e79">before ExcelFile.parse(...)</text>
  <rect x="930" y="290" width="190" height="80" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1025" y="318" text-anchor="middle" class="node-title" fill="#1e5b2a">Economic sheets skipped</text><text x="1025" y="342" text-anchor="middle" class="copy" fill="#1e5b2a">no parse, validation, or CSV</text>
  <rect x="680" y="300" width="190" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="775" y="324" text-anchor="middle" class="node-title" fill="#1f4e79">Non-economic sheets</text><text x="775" y="347" text-anchor="middle" class="copy" fill="#1f4e79">models, ports, variables,</text><text x="775" y="368" text-anchor="middle" class="copy" fill="#1f4e79">streams, algorithms</text>
  <rect x="680" y="470" width="190" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="775" y="498" text-anchor="middle" class="node-title" fill="#1f4e79">migrate.main()</text><text x="775" y="520" text-anchor="middle" class="copy" fill="#1f4e79">run configs → algorithms</text><text x="775" y="539" text-anchor="middle" class="copy" fill="#1f4e79">→ mappings</text>
  <rect x="930" y="470" width="190" height="80" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1025" y="500" text-anchor="middle" class="node-title" fill="#1e5b2a">process_streams runs</text><text x="1025" y="526" text-anchor="middle" class="copy" fill="#1e5b2a">streams remain selectable</text>
  <path d="M930 397 C930 384,1120 384,1120 397 V442 C1120 455,930 455,930 442 Z" fill="#f5f5f5" stroke="#666" stroke-width="2"/><ellipse cx="1025" cy="397" rx="95" ry="13" fill="#f5f5f5" stroke="#666" stroke-width="2"/><text x="1025" y="421" text-anchor="middle" class="node-title" fill="#333">CostEntitiesConfig preserved</text><text x="1025" y="442" text-anchor="middle" class="copy" fill="#333">seed/runtime owned</text>
  <path d="M870 215 H930" class="edge"/><path d="M1025 250 V290" class="edge-green"/><path d="M775 270 V300" class="edge"/><path d="M775 390 V470" class="edge"/><path d="M870 510 H930" class="edge-green"/>
  <rect x="140" y="620" width="920" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="600" y="645" text-anchor="middle" class="node-title" fill="#5b3b68">Verification chain</text><text x="600" y="666" text-anchor="middle" class="copy" fill="#5b3b68">parse spy: sheets unopened  •  four variants: identical CSVs  •  isolated DB sentinel: unchanged</text>
</svg>
